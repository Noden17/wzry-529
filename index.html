// ======================== 匹配算法 ========================
function getResultHero(selections, scores) {
    let bestHero = null;
    let minDist = Infinity;
    for (let [name, hero] of Object.entries(HEROES)) {
        let dist = 0;
        for (let dim of DIMENSIONS) {
            let userVal = scores[dim];
            let heroVal = hero.traitVector[dim];
            if (userVal !== undefined && heroVal !== undefined) {
                dist += Math.pow(userVal - heroVal, 2);
            }
        }
        dist = Math.sqrt(dist);
        if (dist < minDist) {
            minDist = dist;
            bestHero = name;
        }
    }
    return bestHero;
}

let currentIndex = 0;
let selections = new Array(QUESTIONS.length).fill(null);
const container = document.getElementById('dynamicContent');

function renderProgress() {
    let answered = selections.filter(v => v !== null).length;

function buildPages(hero, scores, advice, radarText, personalityModules) {
    const pages = [];
    pages.push(`<div class="radar-container"><div style="font-size:16px; color:#ffcf9a; margin-bottom:10px;">✨ 你的八维人格雷达图 ✨</div><canvas id="radarCanvas" width="300" height="300" style="width:100%; max-width:300px; margin:0 auto; display:block;"></canvas><div class="long-text">${radarText}</div></div>`);

    pages.push(`<div class="stats-container">${Object.keys(hero.stats).map(k => `<div class="stat-item"><div class="stat-name"><span>${k}</span><span>${hero.stats[k]}/10</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${hero.stats[k]*10}%;"></div></div></div>`).join('')}</div><div class="tags">${hero.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>${personalityHtml}`);

function renderResult() {
    const scores = computeRadarScores(selections);
    cachedRadarScores = scores;
    const heroName = getResultHero(selections, scores);
    const hero = HEROES[heroName];
    if (!hero) return renderResult();
    const radarText = radarAnalysis(scores);
    const personalityModules = getPersonalityAnalysis(scores);
    const advice = generateDynamicAdvice(selections, scores);
    resultPages = buildPages(hero, scores, advice, radarText, personalityModules);
    currentResultPage = 0;
    function updateDisplay() {
        container.innerHTML = `<div class="result-card"><div class="hero-name">${heroName}</div><div class="hero-tagline">${hero.tagline}</div>${resultPages[currentResultPage]}<div class="result-pager"><div class="pager-btn" id="prevPageBtn" style="${currentResultPage === 0 ? 'opacity:0.5;pointer-events:none' : ''}">◀ 上一项</div><div class="pager-btn" id="nextPageBtn" style="${currentResultPage === resultPages.length-1 ? 'opacity:0.5;pointer-events:none' : ''}">下一项 ▶</div></div><div class="btn-restart" id="restartBtn">🌙 重新聆听内心 🌙</div></div>`;
        if (currentResultPage === 0) {
            const canvas = document.getElementById('radarCanvas');
            if (canvas) { canvas.width = 300; canvas.height = 300; drawRadar(canvas.getContext('2d'), 300, 300, cachedRadarScores); }
        }
        document.getElementById('prevPageBtn')?.addEventListener('click', () => { if (currentResultPage > 0) { currentResultPage--; updateDisplay(); } });
        document.getElementById('nextPageBtn')?.addEventListener('click', () => { if (currentResultPage < resultPages.length-1) { currentResultPage++; updateDisplay(); } });
        document.getElementById('restartBtn').addEventListener('click', () => { currentIndex = 0; selections.fill(null); renderQuestion(); });
    }
    updateDisplay();
}

function renderQuestion() {
    const q = QUESTIONS[currentIndex];
    const optionsHtml = q.options.map((opt, idx) => `<div class="option" data-val="${idx}">${opt}</div>`).join('');
    const prevBtnHtml = currentIndex > 0 ? `<div class="nav-btn" id="prevQuestionBtn">◀ 上一题</div>` : '';
    const nextBtnHtml = `<div class="nav-btn primary" id="nextQuestionBtn">下一题 ▶</div>`;
    container.innerHTML = `${renderProgress()}<div class="card"><div class="question-text">${currentIndex+1}. ${q.text}</div><div class="options" id="optionsList">${optionsHtml}</div><div class="nav-buttons">${prevBtnHtml}${nextBtnHtml}</div></div>`;
    document.querySelectorAll('.option').forEach(opt => {
        opt.addEventListener('click', (e) => {
            const val = parseInt(opt.dataset.val);
            selections[currentIndex] = val;
            if (currentIndex + 1 < QUESTIONS.length) { currentIndex++; renderQuestion(); }
            else { renderResult(); }
        });
    });
    const prevBtn = document.getElementById('prevQuestionBtn');
    if (prevBtn) prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (nextBtn) nextBtn.addEventListener('click', () => {
        if (selections[currentIndex] !== null) {
            if (currentIndex + 1 < QUESTIONS.length) { currentIndex++; renderQuestion(); }
            else { renderResult(); }
        } else alert('请先选择答案');
    });
}
